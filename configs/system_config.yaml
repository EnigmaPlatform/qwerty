system:
  name: "EmotionalAI"
  version: "1.0.0"
  base_path: "./"
  
modules:
  neural_language_core:
    enabled: true
    model_path: "models/fred-t5"
    context_size: 8192
    max_response_length: 512
    
  emotional_quantum_field:
    enabled: true
    base_emotions: 24
    superposition_depth: 5
    collapse_threshold: 0.7
    
  neurotransmitter_network:
    enabled: true
    update_interval: 100
    plasticity_rate: 0.01

logging:
  level: "INFO"
  directory: "logs/"
  max_file_size: "100MB"
  backup_count: 10
  
metrics:
  collection_interval: 60
  retention_period: "30 days"
  anomaly_detection: true